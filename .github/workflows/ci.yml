name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnome50:
    name: GNOME 50 runtime
    uses: ./.github/workflows/gnome50.yml

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install desktop test tools
        timeout-minutes: 6
        run: |
          sudo bash .github/scripts/install-desktop-tools.sh
      - name: Install development dependencies
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Style, security lint, schemas and behavioral tests
        run: make check
      - name: Validate public source package
        run: make dist

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audited development environment
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Audit runtime and development dependencies, including transitive packages
        run: make audit
